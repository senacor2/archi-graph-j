# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # jgraphx is resolved from the GitHub Packages repository of another project
    # (scij/jgraphx), which the automatic github.token cannot read. Set the
    # GH_PACKAGES_TOKEN secret to a PAT with the read:packages scope; without the
    # secret the build falls back to the automatic token.
    - name: Build with Maven
      run: mvn -B package -s $GITHUB_WORKSPACE/settings.xml --file pom.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

    # Publishing goes to this repository's package registry, so it keeps using the
    # automatic token, which the packages:write permission above covers.
    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}
