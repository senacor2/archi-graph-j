# Builds the shaded jar, packages it into a container image for linux/amd64 and
# linux/arm64 and publishes the multi-arch manifest to the GitHub Container Registry.

name: Docker Image

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # jgraphx is resolved from the GitHub Packages repository of another project
    # (scij/jgraphx), which the automatic github.token cannot read. Set the
    # GH_PACKAGES_TOKEN secret to a PAT with the read:packages scope; without the
    # secret the build falls back to the automatic token.
    - name: Build with Maven
      run: mvn -B package -s $GITHUB_WORKSPACE/settings.xml --file pom.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

    - name: Stage the shaded jar for the image
      run: cp target/archi-graph-j-*.jar target/archi-graph-j.jar

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=ref,event=branch
          type=sha
          type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

    - name: Build and push the image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max